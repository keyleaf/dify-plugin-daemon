version: '3.8'

services:
  dify-plugin-daemon-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dify-plugin-daemon-dev
    volumes:
      # 挂载本地源代码
      - .:/app
      # 挂载Go模块缓存
      - go-mod-cache:/go/pkg/mod
      # 挂载Go构建缓存
      - go-build-cache:/root/.cache/go-build
      # 挂载Python缓存
      - python-cache:/app/.tiktoken
    ports:
      # 应用端口
      - "5002:5002"
      # 调试端口
      - "2345:2345"
    environment:
      - PLATFORM=local
      - GIN_MODE=debug
      - PYTHON_INTERPRETER_PATH=/usr/bin/python3
      # 数据库配置 - 根据你的实际配置修改
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=difyai123456
      - DB_DATABASE=dify_plugin
      # Redis配置 - 根据你的实际配置修改
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=difyai123456
      # 其他配置
      - SERVER_PORT=5002
      - SERVER_KEY=lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi
      - DIFY_INNER_API_KEY=QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1
      - DIFY_INNER_API_URL=http://host.docker.internal:5001
      - PLUGIN_REMOTE_INSTALLING_ENABLED=true
      - PLUGIN_REMOTE_INSTALLING_HOST=127.0.0.1
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=./storage
      - PLUGIN_INSTALLED_PATH=plugin
      - PLUGIN_WORKING_PATH=cwd
      - PERSISTENCE_STORAGE_PATH=persistence
      - PERSISTENCE_STORAGE_MAX_SIZE=104857600
      - PLUGIN_WEBHOOK_ENABLED=true
      - ROUTINE_POOL_SIZE=1024
      - DIFY_INVOCATION_CONNECTION_IDLE_TIMEOUT=120
      - MAX_PLUGIN_PACKAGE_SIZE=52428800
      - DIFY_PLUGIN_SERVERLESS_CONNECTOR_URL=http://host.docker.internal:5004
      - DIFY_PLUGIN_SERVERLESS_CONNECTOR_API_KEY=HeRFb6yrzAy5vUSlJWK2lUl36mpkaRycv4witbQpucXacgXg7G9a8gVL
      - PYTHON_ENV_INIT_TIMEOUT=120
      - PPROF_ENABLED=false
      - FORCE_VERIFYING_SIGNATURE=true
    stdin_open: true
    tty: true
    # 使用bridge网络模式（推荐用于开发环境）
    network_mode: bridge
    # 或者使用host网络模式以便访问宿主机服务
    # network_mode: host

volumes:
  go-mod-cache:
  go-build-cache:
  python-cache:
